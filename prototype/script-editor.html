<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Throughline — Script editor layout (PROTOTYPE)</title>
<!--
  PROTOTYPE (throwaway). Question: which editing-surface layout for the v1 Fountain
  Script lens? Switch with ?layout=split|tabs|overlay, the floating bar, or ← → keys.
  Same HIGH WATER sample content in all three; the preview renders a demo-grade
  subset of the T2 grammar (enough to judge layout, not a conformance parser).
-->
<style>
  :root{
    --bg:#f4f1ea; --card:#fff; --ink:#2a2d33; --dim:#7a7f87; --line:#ddd6c8;
    --accent:#3d7fb5; --fb:#b98a1f;
    --slug:#3d7fb5; --cue:#2a2d33; --trans:#7a7f87;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font:13px/1.5 "Segoe UI",system-ui,sans-serif}

  #rail{position:absolute;left:0;top:52px;bottom:64px;width:230px;border-right:1px solid var(--line);
    background:#efe9dd;overflow-y:auto;padding:10px}
  #rail h2{font-size:10px;letter-spacing:.12em;color:var(--dim);margin-bottom:8px}
  .sc-chip{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 9px;
    margin-bottom:6px;font-size:11px;cursor:pointer}
  .sc-chip.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .sc-chip .fb{color:var(--fb);font-weight:600}
  .sc-chip small{display:block;color:var(--dim)}

  #topbar{position:absolute;left:0;right:0;top:0;height:52px;background:#efe9dd;
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px}
  #topbar b{font-size:14px}
  #topbar .sub{color:var(--dim);font-size:12px}
  #savestate{margin-left:auto;font-size:11px;color:#3d8f5f}

  #surface{position:absolute;left:230px;right:0;top:52px;bottom:64px;display:flex}
  /* --- split --- */
  #pane-write{flex:1 1 50%;min-width:120px;display:flex;flex-direction:column;border-right:1px solid var(--line)}
  #divider{width:5px;cursor:col-resize;background:transparent;flex:none}
  #divider:hover{background:#d9cfb8}
  #pane-preview{flex:1 1 50%;min-width:120px;overflow-y:auto;background:#fbf9f4;padding:26px 40px}
  textarea{flex:1;width:100%;resize:none;border:0;outline:0;background:transparent;color:var(--ink);
    font:13px/1.55 Consolas,"Courier New",monospace;padding:26px 34px}
  .pane-label{font-size:10px;letter-spacing:.12em;color:var(--dim);padding:6px 34px 0;text-transform:uppercase}
  /* --- tabs --- */
  #tabbar{display:flex;gap:2px;background:#e7e0d0;padding:6px 12px 0}
  #tabbar button{all:unset;cursor:pointer;font-size:12px;padding:6px 18px;border-radius:6px 6px 0 0;color:var(--dim)}
  #tabbar button.on{background:#fbf9f4;color:var(--ink)}
  /* --- preview typography (all variants) --- */
  .f-slug{color:var(--slug);font-weight:700;text-transform:uppercase;margin:18px 0 12px}
  .f-action{margin:12px 0;max-width:70ch}
  .f-cue{margin:14px 0 0;text-transform:uppercase;font-weight:600;max-width:40ch}
  .f-paren{margin:0 15%;max-width:35ch;font-style:italic;color:var(--dim)}
  .f-dlg{margin:2px 15%;max-width:38ch}
  .f-trans{text-align:right;text-transform:uppercase;color:var(--trans);margin:14px 0}
  .f-center{text-align:center;margin:14px 0}
  .f-dual{display:flex;gap:24px}.f-dual>div{flex:1}
  .f-hint{color:#a08c28;background:#faf3df;border-radius:4px;padding:0 3px}

  /* overlay */
  #overlay{position:fixed;right:26px;top:72px;bottom:80px;width:min(520px,44vw);z-index:40;
    background:#fbf9f4ee;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 40px #0003;
    overflow-y:auto;padding:26px 40px;backdrop-filter:blur(2px)}
  #ovclose{position:absolute;top:8px;right:12px;all:unset;cursor:pointer;color:var(--dim);font-size:16px}

  #bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;
    background:#2b2620ee;border:1px solid #57493a;border-radius:999px;padding:5px 8px;z-index:50;box-shadow:0 6px 24px #0005}
  #bar button{all:unset;cursor:pointer;padding:4px 12px;color:#f0e9de;font-size:14px;border-radius:999px}
  #bar button:hover{background:#453a2d}
  #bar .vname{min-width:260px;text-align:center;font-size:12px;color:#fff}
  #watermark{position:fixed;top:12px;right:-34px;transform:rotate(35deg);background:#b3452f;color:#fff;
    font-size:10px;font-weight:700;letter-spacing:.2em;padding:4px 40px;z-index:60}
  #hint{position:fixed;bottom:58px;left:50%;transform:translateX(-50%);font-size:10px;color:#8d8574;z-index:40}
</style>
</head>
<body>
<div id="topbar"><b>Script</b><span class="sub">HIGH WATER · E1 “RISE”</span><span id="savestate">Saved ✓</span></div>
<div id="watermark">PROTOTYPE</div>
<div id="rail"><h2>SCENES — E1</h2><div id="chips"></div></div>
<div id="surface"></div>
<div id="hint">drag empty space? no — this one scrolls · ← → = switch layout · Esc closes overlay</div>
<div id="bar"><button id="prev">‹</button><div class="vname" id="vname"></div><button id="next">›</button></div>
<script>
"use strict";
addEventListener("error",e=>{document.body.insertAdjacentHTML("beforeend",
 '<pre id="ERR">JS ERROR: '+e.message+" @line "+e.lineno+"</pre>")});

/* ---- sample fragments (HIGH WATER, E1) — plain Fountain text ---- */
const FRAGMENTS={
 s1:`INT. BOATHOUSE - NIGHT

The surge hits. MAYA fights the airboat onto the lift,
rain hammering the tin roof.

ELI
(shouting over wind)
Tell me that was thunder!

Maya doesn't answer. She's counting boats.

> COUNT WITH HER -`,
 s2:`INT. BOATHOUSE - NIGHT - LATER

Two log books side by side on the workbench.
Same storm. Different names.

MAYA
Cole Whitaker wasn't on the water.

She photographs the page. The flash catches
something taped under the drawer.`,
 s3:`EXT. SHALLOWS - DAWN

A flare arcs. Nobody radioed it in.

MAYA
^ There! Port side!
SAM
^ I see it!

They beach the boat and run.`,
 s4:`INT. RANCH - DUSK

[ACTION — what does Eli see that changes the deal?]

COLE
(quiet)
Signed clean. Your father wanted that.

[Does Eli take the paper, or let it sit?]`,
};
const CHARS={maya:"Maya",eli:"Eli",sam:"Sam",cole:"Cole"};
const SCENES=[
 {id:"s1",label:"Boathouse — Storm tips",day:1},
 {id:"s2",label:"Boathouse — Log book",day:1},
 {id:"s3",label:"Shallows — Flare",day:2},
 {id:"s4",label:"Ranch — Offer (new)",day:10,fb:true},
];
let active="s1";

/* ---- demo-grade preview renderer (subset feel, not conformance) ---- */
function renderPreview(src){
 const out=[];let prev="";
 const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
 const cls=l=>{
  if(/^([IiNnEe][NnTtXx]|EST\.|I\/E)/.test(l)||/^#{1,3}\s/.test(l))return"f-slug";
  if(/^>$/.test(l.trim()))return"f-center";
  if(l.startsWith(">")&&l.endsWith("<"))return"f-center";
  if(l.startsWith(">")||(/TO:$/.test(l)))return"f-trans";
  if(/^\(.+\)$/.test(l.trim()))return"f-paren";
  if(l===l.toUpperCase()&&/[A-Z]/.test(l)&&l.length<40&&/^[\w'.\- ]+$/.test(l))return"f-cue";
  return(prev==="f-cue"||prev==="f-paren"||prev==="f-dlg")?"f-dlg":"f-action";
 };
 const lines=src.split(/\r?\n/);
 for(let i=0;i<lines.length;i++){
  const raw=lines[i]??"";
  if(raw.trim()===""){prev="";continue}
  const c=cls(raw.trim());
  if(c==="f-cue"&&(lines[i+1]?? "").trim().endsWith("^")){
   // naive dual-dialogue pairing: cue A / cue B / lines...
   out.push('<div class="f-dual"><div>'+
     '<div class="f-cue">'+esc(raw.trim())+"</div>"+
     '<div class="f-dlg">'+esc((lines[i+2]??"").trim())+"</div></div><div>"+
     '<div class="f-cue">'+esc((lines[i+1]??"").trim().replace(/\^$/,""))+"</div>"+
     '<div class="f-dlg">'+esc((lines[i+3]??"").trim())+"</div></div></div>");
   i+=3;prev="";continue;
  }
  const txt=raw.replace(/\^$/,"");
  out.push(c==="f-hint"?raw:'<div class="'+c+'">'+esc(txt)+"</div>");
  prev=c;
 }
 return out.join("\n");
}
// bracketed [HINTS] from the full template render visibly:
function decorate(html){
 return html.replace(/\[([^\]<]{3,80})\]/g,'<span class="f-hint">[$1]</span>');
}

/* ---- layouts ---- */
const el=id=>document.getElementById(id);
function chips(){
 el("chips").innerHTML=SCENES.map(s=>
  `<div class="sc-chip${s.id===active?" on":""}" data-id="${s.id}">`+
  `${s.fb?'<span class="fb">FB · </span>':""}${s.label}<small>D${s.day}</small></div>`).join("");
 el("chips").querySelectorAll(".sc-chip").forEach(c=>c.onclick=()=>{active=c.dataset.id;draw()});
}
function previewHTML(){return decorate(renderPreview(FRAGMENTS[active]??""))}

const LAYOUTS=["split","tabs","overlay"];
let li=Math.max(0,LAYOUTS.indexOf(new URLSearchParams(location.search).get("layout")||"split"));

function draw(){
 const L=LAYOUTS[li];el("vname").textContent="Layout · "+L;
 chips();const surf=el("surface");el("#overlay")?.remove?.();
 const old=document.getElementById("overlay");if(old)old.remove();
 if(L==="split"){
  surf.innerHTML=
   '<div id="pane-write"><div class="pane-label">Fountain — write</div><textarea id="ta" spellcheck="false"></textarea></div>'+
   '<div id="divider"></div>'+
   '<div id="pane-preview"><div class="pane-label">Preview — T2 subset</div><div id="pv"></div></div>';
  const ta=el("ta");ta.value=FRAGMENTS[active];
  ta.oninput=()=>{FRAGMENTS[active]=ta.value;el("pv").innerHTML=previewHTML();
    el("savestate").textContent="Saving…";setTimeout(()=>el("savestate").textContent="Saved ✓",500)};
  const pv=el("pv");pv.innerHTML=previewHTML();
  let dragging=false;
  el("divider").onmousedown=e=>{dragging=true;e.preventDefault()};
  addEventListener("mousemove",e=>{if(!dragging)return;
   const r=surf.getBoundingClientRect(),p=(e.clientX-r.left)/r.width*100;
   el("pane-write").style.flex=`0 0 ${Math.min(85,Math.max(15,p))}%`});
  addEventListener("mouseup",()=>dragging=false);
 }else if(L==="tabs"){
  surf.innerHTML='<div style="flex:1;display:flex;flex-direction:column">'+
   '<div id="tabbar"><button data-t="w" class="on">Write</button><button data-t="p">Preview</button></div>'+
   '<div id="tw" style="flex:1;display:flex;flex-direction:column"><textarea id="ta" spellcheck="false"></textarea></div>'+
   '<div id="tp" style="flex:1;display:none;overflow-y:auto;background:#fbf9f4;padding:26px 40px"><div id="pv"></div></div></div>';
  const ta=el("ta");ta.value=FRAGMENTS[active];el("pv").innerHTML=previewHTML();
  el("tabbar").querySelectorAll("button").forEach(b=>b.onclick=()=>{
   el("tabbar").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
   const w=b.dataset.t==="w";el("tw").style.display=w?"flex":"none";el("tp").style.display=w?"none":"block"});
  ta.oninput=()=>{FRAGMENTS[active]=ta.value;el("pv").innerHTML=previewHTML();
   el("savestate").textContent="Saving…";setTimeout(()=>el("savestate").textContent="Saved ✓",500)};
 }else{
  surf.innerHTML='<div style="flex:1;display:flex;flex-direction:column">'+
   '<div class="pane-label">Fountain — write <button id="ovbtn" style="all:unset;cursor:pointer;color:var(--accent)">· preview (Ctrl+P)</button></div>'+
   '<textarea id="ta" spellcheck="false"></textarea></div>'+
   '<div id="overlay" style="display:none"><button id="ovclose">×</button><div id="pv"></div></div>';
  const ta=el("ta");ta.value=FRAGMENTS[active];el("pv").innerHTML=previewHTML();
  const toggle=()=>{const o=el("overlay");o.style.display=o.style.display==="none"?"block":"none"};
  el("ovbtn").onclick=toggle;el("ovclose").onclick=toggle;
  ta.oninput=()=>{FRAGMENTS[active]=ta.value;el("pv").innerHTML=previewHTML();
   el("savestate").textContent="Saving…";setTimeout(()=>el("savestate").textContent="Saved ✓",500)};
 }
}
function go(d){li=(li+d+LAYOUTS.length)%LAYOUTS.length;
 try{history.replaceState(null,"",location.pathname+"?layout="+LAYOUTS[li])}catch(_){}
 draw()}
el("prev").onclick=()=>go(-1);el("next").onclick=()=>go(1);
addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")go(-1);
 if(e.key==="ArrowRight")go(1);
 if(e.key==="Escape"){const o=document.getElementById("overlay");if(o)o.style.display="none"}});
draw();
</script>
</body>
</html>
