<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-labelledby="title desc"><title id="title">Story Lane / Shot / Reverse Shot</title><desc id="desc">Two opposing dialogue panels become a shot and its reverse angle. A familiar filmmaking idea, expressed through the writing.</desc><rect width="760" height="230" rx="20" fill="#172622"/><g transform="translate(34 38) scale(1.2)"><path d="M29 15H12v18m87-18h17v18M12 96v17h17m70 0h17V96" fill="none" stroke="#8ddaaf" stroke-width="5"/><path d="M23 29h70v29H49L36 71V58H23Z" fill="#f2f0e5"/><path d="M105 76H49v27h28l13 12v-12h15Z" fill="#8ddaaf"/><path d="M46 38h25M34 47h47M67 85h20M60 94h34" stroke="#172622" stroke-width="3"/></g><text x="230" y="119" fill="#f2f0e5" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="650" letter-spacing="-2.8">Story Lane</text><path d="M233 145h35" stroke="#8ddaaf" stroke-width="3"/><text x="285" y="149" fill="#8ddaaf" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2">STORIES MADE FOR THE SCREEN</text></svg>