<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-labelledby="title desc"><title id="title">Story Lane / Frame &amp; Flow</title><desc id="desc">A single screen contains two offset story beats and a connecting S-curve. The lower frame opens into a subtle dialogue tail.</desc><rect width="760" height="230" rx="20" fill="#172622"/><g transform="translate(34 38) scale(1.2)"><path d="M22 20h84a9 9 0 0 1 9 9v62a9 9 0 0 1-9 9H71l-20 17v-17H22a9 9 0 0 1-9-9V29a9 9 0 0 1 9-9Z" fill="none" stroke="#f2f0e5" stroke-width="6" stroke-linejoin="round"/><path d="M53 41h27c19 0 19 36 0 36H55" fill="none" stroke="#e8b872" stroke-width="5" stroke-linecap="round"/><rect x="26" y="33" width="34" height="18" rx="3" fill="#8ddaaf"/><rect x="52" y="68" width="43" height="18" rx="3" fill="#8ddaaf"/><path d="M34 42h18M60 77h27" stroke="#172622" stroke-width="3"/></g><text x="230" y="119" fill="#f2f0e5" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="650" letter-spacing="-2.8">Story Lane</text><path d="M233 145h35" stroke="#8ddaaf" stroke-width="3"/><text x="285" y="149" fill="#8ddaaf" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2">STORIES MADE FOR THE SCREEN</text></svg>